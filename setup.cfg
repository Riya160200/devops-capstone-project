[nosetests]
verbosity=2
with-spec=1
spec-color=1
with-coverage=1
cover-erase=1
cover-package=service

[coverage:run]
branch = True
source = service
omit =
    */tests/*
    */test_*.py

[coverage:report]
show_missing = True
skip_covered = True
fail_under = 80

[flake8]
max-line-length = 88
exclude = .git,__pycache__,venv,.venv,build,dist
ignore = E203,W503

[pylint]
max-line-length = 88
disable = C0114,C0115,C0116
